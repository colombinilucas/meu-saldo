<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meu Saldo</title>
  <meta name="description" content="Controle pessoal de salário e gastos. Os dados ficam só no seu aparelho.">
  <meta name="theme-color" content="#2c5545">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Meu Saldo">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <a class="skip" href="#view">Pular para o conteúdo</a>

  <header class="topbar">
    <div class="topbar-inner">
      <span class="brand">Meu Saldo</span>
      <div class="month-nav" aria-label="Mês selecionado">
        <button id="prevMonth" class="icon-btn" type="button" aria-label="Mês anterior">‹</button>
        <button id="monthLabel" class="month-label" type="button" aria-label="Escolher mês">…</button>
        <button id="nextMonth" class="icon-btn" type="button" aria-label="Próximo mês">›</button>
      </div>
      <button id="settingsBtn" class="icon-btn gear" type="button" data-view="ajustes" aria-label="Ajustes"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <nav class="tabs" aria-label="Seções">
    <button class="tab" type="button" data-view="inicio"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/></svg>Início</button>
    <button class="tab" type="button" data-view="gastos"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Gastos</button>
    <button class="tab" type="button" data-view="resumo"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumo</button>
    <button class="tab" type="button" data-view="cofre"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="15" rx="2"/><circle cx="12" cy="12.5" r="3"/><path d="M12 9.5v-1M7 20v1.5M17 20v1.5"/></svg>Cofre</button>
    <button class="tab" type="button" data-view="docs"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>Docs</button>
  </nav>

  <main id="view" tabindex="-1">
    <p class="empty">Carregando…</p>
  </main>

  <button id="fab" class="fab" type="button">+ Gasto</button>

  <dialog id="dlg" aria-modal="true"></dialog>
  <dialog id="confirm" aria-modal="true"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/util.js"></script>
  <script src="js/db.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/docs.js"></script>
  <script src="js/cofre.js"></script>
  <script src="js/zip.js"></script>
  <script src="js/backup.js"></script>
  <script src="js/ofx.js"></script>
  <script src="js/extrato-pdf.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
